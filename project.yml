name: VidToDiscord
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_NAME: "Vid to Discord"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VidToDiscord:
    type: application
    platform: macOS
    sources:
      - VidToDiscord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.VidToDiscord
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_CFBundleDisplayName: "Vid to Discord"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Ethan Freeman"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
