name: ShrinkRay
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_NAME: ShrinkRay
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShrinkRay:
    type: application
    platform: macOS
    sources:
      - ShrinkRay
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ShrinkRay
        PRODUCT_MODULE_NAME: ShrinkRay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_CFBundleDisplayName: ShrinkRay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Ethan Freeman"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
  ShrinkRayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ShrinkRayTests
    dependencies:
      - target: ShrinkRay
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_MODULE_NAME: ShrinkRayTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShrinkRay.app/Contents/MacOS/ShrinkRay"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ShrinkRay:
    shared: true
    build:
      targets:
        ShrinkRay: all
    test:
      targets:
        - ShrinkRayTests
